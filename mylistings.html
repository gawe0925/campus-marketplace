<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage My Listings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container mt-4">
    <div class="header-left">
        <img src="images/mq_marketplace_logo.png" class="logo" width="50" height="50" alt="Campus Marketplace Logo">
        <span class="app-name">Campus Marketplace</span>
    </div>

    <div class="header-center">
        <h1 class="page-title">Manage My Listings</h1>
    </div>
     <p class="mb-0">
        Signed in as: <strong id="userEmail"></strong>
    </p>
                    
    <button class="btn btn-outline-danger" id="signOutButton">Sign Out</button>
    <button class="btn-add" onclick="goToCreate()">Add New Listing</button>
    <button type="button" onclick="window.location.href='index.html'">Back to Home</button>
</div>




<div id="listingsContainer" class="container mt-4"></div>

<script type="module">
    import { onUserReady, getUserListings, deleteItem } from "./app.js";

    const container = document.getElementById("listingsContainer");

    // Load only this user's items
    onUserReady(async () => {
        const items = await getUserListings();

        if (items.length === 0) {
            container.innerHTML = `<p class="text-muted">No listings found.</p>`;
            return;
        }

        items.forEach(item => {
            const firstImage = item.imageUrls?.[0] || "placeholder.jpg";

            container.innerHTML += `
                <div class="listing-card">

                    <img src="${firstImage}" alt="Listing Image">

                    <div class="listing-details">
                      

                        <h4 style="color: #007bff;">${item.productName}</h4>
                        <p><strong>Description:</strong> ${item.description}</p>
                        <p><strong>Condition:</strong> ${item.condition}</p>
                        <p class="text-muted"><strong>Price:</strong> ${item.price}</p>

                        <div class="action-buttons">
                            <button class="btn-edit" onclick="editItem('${item.id}')">Edit</button>
                            <button class="btn-delete" onclick="confirmDelete('${item.id}')">Delete</button>
                        </div>
                    </div>

                </div>
            `;
        });
    });

    // Navigation functions
    window.goToCreate = function () {
        window.location.href = "Create_new_list2.html";
    };

    window.editItem = function (id) {
        window.location.href = `Edit_listing2.html?id=${id}`;
    };

    // Delete function
    window.confirmDelete = function(id) {
        if (!confirm("Are you sure you want to delete this listing?")) return;

        deleteItem(id)
            .then(() => {
                alert("Listing deleted");
                location.reload();
            })
            .catch(err => {
                console.error("Delete failed:", err);
                alert("Failed to delete listing");
            });
    };
</script>

</body>
</html>
