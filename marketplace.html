<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="marketplace.css">
    <title>Market Place</title>
</head>
<body>

    <div class="container-fluid page-wrapper d-flex justify-content-center align-items-start py-4 px-3">
        <div class="card page-card marketplace-card shadow">
            <div class="card-body p-4 p-md-5">

                <!-- Header — matches index.html structure -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="d-flex align-items-center">
                        <img src="images/mq_marketplace_logo.png" alt="Campus Marketplace Logo" class="logo me-3">
                        <div>
                            <h1 class="h4 brand-title mb-0">Campus Marketplace</h1>
                            <small class="text-muted">Marketplace</small>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button onclick="window.location.href='mylistings.html'" class="btn btn-outline-secondary btn-sm">My Listings</button>
                        <button onclick="window.location.href='shortlist.html'" class="btn btn-outline-secondary btn-sm">My Shortlist</button>
                        <button onclick="window.location.href='index.html'" class="btn btn-outline-danger btn-sm">Homepage</button>
                        <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button>
                    </div>
                </div>

                <hr class="mb-4">

                <div class="filter-bar">
                    <button class="filter-btn active" data-category="all">All</button>
                    <button class="filter-btn" data-category="Books">Books</button>
                    <button class="filter-btn" data-category="Electronics">Electronics</button>
                    <button class="filter-btn" data-category="Furniture">Furniture</button>
                    <button class="filter-btn" data-category="Clothing">Clothing</button>
                </div>

                <div class="main_container"></div>

            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <img id="modalImage">
            <div class="modal-info">
                <h3 id="modalName"></h3>
                <p class="modal-price" id="modalPrice"></p>
                <p class="modal-label">Category</p>
                <span class="modal-category" id="modalCategory"></span>
                <p class="modal-label">Item Condition</p>
                <p class="modal-codi" id="modalCondi"></p>
                <p class="modal-label">Description</p>
                <p class="modal-desc" id="modalDescription"></p>
                <p class="modal-email" id="modalEmail"></p>
            </div>
        </div>
    </div>

    <script type="module" src="marketplace.js"></script>
</body>
</html>
